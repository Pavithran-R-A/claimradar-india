name: Temporary PR58 Format Probe
on:
  push:
    branches: [fix/sebi-official-pdf-evidence-20261011]
    paths:
      - .github/workflows/pr58-format-probe.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/crawler/src/adapters/html/sebi-public-notices.ts
          git diff -- apps/crawler/src/adapters/html/sebi-public-notices.ts
