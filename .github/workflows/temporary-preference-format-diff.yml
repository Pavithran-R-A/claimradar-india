name: Temporary formatter diagnostic
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Show precise Prettier changes
        run: |
          pnpm exec prettier --write apps/web/tests/unit/recovery-intent.test.ts scripts/ci-browser-smoke.mjs
          git diff -- apps/web/tests/unit/recovery-intent.test.ts scripts/ci-browser-smoke.mjs
