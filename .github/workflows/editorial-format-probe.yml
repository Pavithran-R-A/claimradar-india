name: Temporary Editorial Format Probe
on:
  push:
    branches: [fix/editorial-publish-gates-20261012]
    paths:
      - .github/workflows/editorial-format-probe.yml
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/web/app/admin/editorial-actions.ts apps/web/lib/editorial-publication-safety.ts apps/web/tests/unit/editorial-publication-safety.test.ts
          git diff -- apps/web/app/admin/editorial-actions.ts apps/web/lib/editorial-publication-safety.ts apps/web/tests/unit/editorial-publication-safety.test.ts
