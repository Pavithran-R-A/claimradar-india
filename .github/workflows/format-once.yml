name: One-time migration doc formatter

on:
  push:
    branches:
      - feat/railway-supabase-worker-gateway-20261007
    paths:
      - '.github/workflows/format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/railway-supabase-worker-gateway-20261007
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize migration evidence formatting
        run: pnpm exec prettier --write docs/checkpoints/railway-worker-migration-2026-10-07.md

      - name: Commit normalized formatting and remove this workflow
        shell: bash
        run: |
          git config user.name "Pavithran R A"
          git config user.email "92867708+Pavithran-R-A@users.noreply.github.com"
          git rm .github/workflows/format-once.yml
          git add -A
          git commit -m "style: format Railway migration evidence"
          git push origin HEAD:feat/railway-supabase-worker-gateway-20261007
