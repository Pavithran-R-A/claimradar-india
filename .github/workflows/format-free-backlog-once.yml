name: Format ClaimKhoj free backlog patch
on:
  push:
    branches:
      - ops/claimkhoj-bounded-free-ai-backlog-20261008
    paths:
      - .github/workflows/format-free-backlog-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ops/claimkhoj-bounded-free-ai-backlog-20261008
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/run-railway-soak.mjs
      - name: Commit script formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-railway-soak.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format bounded free AI backlog worker"
            git push origin HEAD:ops/claimkhoj-bounded-free-ai-backlog-20261008
          fi
