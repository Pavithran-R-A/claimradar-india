name: One-time admin inbox formatting
on:
  push:
    branches:
      - fix/claimkhoj-support-notification-truth-20261030
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Format admin inbox exactly
        run: |
          pnpm exec prettier --write apps/web/app/admin/customer-requests/page.tsx
          git diff --check
      - name: Commit formatter result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add apps/web/app/admin/customer-requests/page.tsx
            git commit -m 'style: format admin customer request row types'
            git push origin HEAD:fix/claimkhoj-support-notification-truth-20261030
          fi
