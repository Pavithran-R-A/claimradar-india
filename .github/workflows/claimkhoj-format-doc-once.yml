name: Temporary launch doc formatter
on:
  push:
    branches:
      - release/claimkhoj-domain-notification-20261009
    paths:
      - .github/workflows/claimkhoj-format-doc-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/checkpoints/claimkhoj-domain-resend-launch-20261009.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/checkpoints/claimkhoj-domain-resend-launch-20261009.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format ClaimKhoj domain email launch instructions"
            git push origin HEAD:release/claimkhoj-domain-notification-20261009
          fi
