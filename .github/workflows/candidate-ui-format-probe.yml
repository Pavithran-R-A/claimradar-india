name: Temporary Candidate UI Format Diff
on:
  push:
    branches: [fix/staff-review-queue-claim-link-20261013]
    paths:
      - .github/workflows/candidate-ui-format-probe.yml
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write 'apps/web/app/admin/candidates/[id]/page.tsx'
          git diff -- 'apps/web/app/admin/candidates/[id]/page.tsx'
