name: Format ClaimKhoj fix 53
on:
  push:
    branches:
      - fix/claimkhoj-extraction-currency-and-alert-guards-20261009
    paths:
      - .github/workflows/claimkhoj-fix53-prettier-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/crawler/tests/ai/free-router-schema-boundary.test.ts \
            apps/web/tests/unit/claimkhoj-email-release.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/crawler/tests/ai/free-router-schema-boundary.test.ts apps/web/tests/unit/claimkhoj-email-release.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format ClaimKhoj safety and crawler regression tests"
            git push origin HEAD:fix/claimkhoj-extraction-currency-and-alert-guards-20261009
          fi
