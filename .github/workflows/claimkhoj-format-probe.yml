name: Temporary Directory Format Probe
on:
  push:
    branches: [fix/consumer-notice-directory-20261011]
    paths:
      - .github/workflows/claimkhoj-format-probe.yml
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/web/components/directory/official-notices-preview.tsx apps/web/lib/official-notice-ranking.ts apps/web/tests/unit/official-notice-ranking.test.ts
          git diff -- apps/web/components/directory/official-notices-preview.tsx apps/web/lib/official-notice-ranking.ts apps/web/tests/unit/official-notice-ranking.test.ts
