name: Temporary ClaimKhoj responsive formatter
on:
  push:
    branches:
      - fix/customer-workspace-responsive-20261009
    paths:
      - .github/workflows/claimkhoj-responsive-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier formatting
        run: |
          pnpm exec prettier --write \
            "apps/web/app/(public)/pricing/page.tsx" \
            "apps/web/app/app/billing/page.tsx" \
            "apps/web/app/app/profile/page.tsx" \
            "scripts/ci-browser-smoke.mjs"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/web/app/(public)/pricing/page.tsx" "apps/web/app/app/billing/page.tsx" "apps/web/app/app/profile/page.tsx" "scripts/ci-browser-smoke.mjs"
          if ! git diff --cached --quiet; then
            git commit -m "style: canonical Prettier formatting for workspace release"
            git push origin HEAD:fix/customer-workspace-responsive-20261009
          fi
