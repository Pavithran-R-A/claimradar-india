name: GitHub Source Connectivity Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Probe official source connectivity
        env:
          GITHUB_ACTIONS: 'true'
          PROBE_OUTPUT: ${{ github.workspace }}/github-source-connectivity.json
        run: node scripts/github-source-connectivity-probe.mjs

      - name: Upload sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-source-connectivity
          path: github-source-connectivity.json
          if-no-files-found: warn
