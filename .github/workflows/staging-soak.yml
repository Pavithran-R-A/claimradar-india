name: Staging Soak (48-72h)

on:
  schedule:
    - cron: '17 */6 * * *' # Every 6 hours at :17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no DB writes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: staging-soak
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Run crawler tests
        run: pnpm --filter @claimradar/crawler test

      - name: Preflight policy gate
        run: pnpm crawler:preflight -- --environment=staging
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          AUTO_VERIFY_CLAIMABLES: 'false'
          ENABLE_BILLING: 'false'

      - name: Run staging soak crawl
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'none' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CRAWLER_USER_AGENT: 'ClaimRadar India Soak Bot/1.0 (+https://claimradar.in)'
          LIVE_ADAPTERS_ENABLED: 'true'
          AI_DAILY_REQUEST_BUDGET: ${{ vars.AI_DAILY_REQUEST_BUDGET || '40' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Staging safety guards — pinned, never sourced from vars/secrets.
          APP_ENV: 'staging'
          AUTO_VERIFY_CLAIMABLES: 'false'
          ENABLE_BILLING: 'false'
          NOTIFY_CUSTOMERS_ENABLED: 'false'
          CRAWLER_SUMMARY_FILE: 'soak-crawl-summary.json'
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          pnpm crawler:daily $DRY_FLAG

      - name: Publish sanitized soak job summary
        if: always()
        shell: bash
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const file = 'soak-crawl-summary.json';
          if (!fs.existsSync(file)) {
            console.log('## Staging Soak Run');
            console.log('');
            console.log('_No crawl summary produced (run failed before the pipeline completed)._');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(file, 'utf-8'));
          const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
          const cleanId = (v) => String(v ?? 'unknown').replace(/[|`\\]/g, '').slice(0, 64);
          const lines = [
            '## Staging Soak (48-72h) - Run Summary',
            '',
            '| Metric | Value |',
            '| --- | --- |',
            `| Sources | ${num(s.sourcesSucceeded)}/${num(s.sourcesAttempted)} succeeded, ${num(s.sourcesFailed)} failed |`,
            `| Documents | ${num(s.documentsDiscovered)} discovered, ${num(s.documentsFetched)} fetched |`,
            `| Unchanged / duplicates | ${num(s.documentsUnchanged)} / ${num(s.documentsDuplicate)} |`,
            `| Candidates | ${num(s.candidatesCreated)} |`,
            `| AI calls | ${num(s.aiCallsUsed)} used, ${num(s.aiCallsFailed)} failed |`,
            `| Publications | ${num(s.recordsPublished)} published, ${num(s.recordsQueued)} queued, ${num(s.recordsRejected)} rejected |`,
            `| Errors | ${num(s.errorCount)} |`,
            `| Duration | ${(num(s.durationMs) / 1000).toFixed(1)}s |`,
            '',
            '### Policy Guards',
            '- `ENABLE_BILLING`: false',
            '- `AUTO_VERIFY_CLAIMABLES`: false',
            '- `NOTIFY_CUSTOMERS_ENABLED`: false',
            '',
            '### Per-source status',
            '',
            '| Source | Status | Discovered | Fetched | Candidates | Errors |',
            '| --- | --- | --- | --- | --- | --- |',
          ];
          for (const p of Array.isArray(s.perSource) ? s.perSource : []) {
            lines.push(
              `| ${cleanId(p.sourceId)} | ${p.status === 'succeeded' ? 'OK' : 'FAIL'} | ${num(p.discovered)} | ${num(p.fetched)} | ${num(p.candidates)} | ${num(p.errors)} |`,
            );
          }
          console.log(lines.join('\n'));
          EOF

      - name: Upload soak run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-soak-summary
          path: soak-crawl-summary.json
          if-no-files-found: ignore
