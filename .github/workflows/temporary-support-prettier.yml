name: One-time Prettier correction for support PR
on:
  push:
    branches:
      - fix/claimkhoj-support-notification-truth-20261030
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Format only support PR source files
        run: |
          pnpm exec prettier --write \
            'apps/web/app/(public)/contact/page.tsx' \
            'apps/web/app/(public)/corrections/page.tsx' \
            'apps/web/app/(public)/how-it-works/page.tsx' \
            'apps/web/app/admin/customer-requests/actions.ts' \
            'apps/web/app/admin/customer-requests/page.tsx' \
            'apps/web/app/app/notifications/page.tsx' \
            'apps/web/app/app/privacy-actions.ts' \
            'apps/web/app/app/privacy/page.tsx' \
            'apps/web/app/app/settings/page.tsx' \
            'apps/web/tests/unit/customer-support-launch.test.ts'
          git diff --check
      - name: Commit exact formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add apps/web
            git commit -m 'style: apply exact prettier formatting to customer support release'
            git push origin HEAD:fix/claimkhoj-support-notification-truth-20261030
          fi
