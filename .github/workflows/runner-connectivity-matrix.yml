name: Temporary Runner Connectivity Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
        repetition: [1, 2, 3]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Probe official endpoints
        env:
          GITHUB_ACTIONS: 'true'
          PROBE_OUTPUT: runner-connectivity.json
        run: node scripts/github-runner-connectivity-matrix.mjs

      - name: Upload sanitized runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-connectivity-${{ matrix.runner }}-${{ matrix.repetition }}
          path: runner-connectivity.json
          if-no-files-found: warn
