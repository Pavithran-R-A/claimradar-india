name: Temporary Staff Format Diff
on:
  push:
    branches: [fix/staff-review-queue-claim-link-20261013]
    paths:
      - .github/workflows/staff-review-format-probe.yml
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/web/app/admin/reviews/page.tsx apps/web/lib/official-filing-route.ts apps/web/tests/unit/official-filing-route.test.ts
          git diff -- apps/web/app/admin/reviews/page.tsx apps/web/lib/official-filing-route.ts apps/web/tests/unit/official-filing-route.test.ts
