name: Temporary Prettier diagnostic
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/claimkhoj-consumer-routes-expiry-20261029
permissions:
  contents: read
jobs:
  formatter-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Show exact formatter difference
        run: |
          pnpm exec prettier --write apps/web/app/admin/actions.ts
          git diff -- apps/web/app/admin/actions.ts
