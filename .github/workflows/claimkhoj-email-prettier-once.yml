name: Format ClaimKhoj email HTML
on:
  push:
    branches:
      - feat/claimkhoj-professional-auth-email-20261009
    paths:
      - .github/workflows/claimkhoj-email-prettier-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical HTML formatting
        run: pnpm exec prettier --write "supabase/email-templates/*.html"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/email-templates/
          if ! git diff --cached --quiet; then
            git commit -m "style: canonical formatting of branded auth emails"
            git push origin HEAD:feat/claimkhoj-professional-auth-email-20261009
          fi
