name: Format SEBI regression test once
on:
  push:
    branches: [fix/sebi-double-origin-20261010]
    paths: [.github/workflows/sebi-formatter-once.yml]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/crawler/tests/adapters/sebi-rss-url-normalization.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/crawler/tests/adapters/sebi-rss-url-normalization.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format SEBI URL regression test"
            git push origin HEAD:fix/sebi-double-origin-20261010
          fi
