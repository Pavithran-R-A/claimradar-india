name: Generate ClaimKhoj email logo PNG
on:
  push:
    branches:
      - feat/claimkhoj-professional-auth-email-20261009
    paths:
      - .github/workflows/claimkhoj-email-logo-once.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rasterize existing ClaimKhoj brand mark for email clients
        run: |
          python -m pip install cairosvg==2.7.1
          mkdir -p apps/web/public/email
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='apps/web/app/icon.svg',
              write_to='apps/web/public/email/claimkhoj-mark.png',
              output_width=96, output_height=96)
          PY
      - name: Commit image asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/email/claimkhoj-mark.png
          git commit -m "assets: add Gmail-compatible PNG of existing ClaimKhoj mark"
          git push origin HEAD:feat/claimkhoj-professional-auth-email-20261009
