name: One-time SEBI historical candidate read-only audit
on:
  push:
    branches:
      - audit/claimkhoj-sebi-20261030

permissions:
  contents: read

jobs:
  saved-evidence-audit:
    name: Audit stored SEBI evidence (SELECT only, no AI)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Build current project workspace
        run: pnpm build
      - name: Preflight staging policy
        env:
          APP_ENV: staging
          EXPECTED_STAGING_SUPABASE_PROJECT_REF: upvsfqufkywlpibbwrse
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          AUTO_VERIFY_CLAIMABLES: 'false'
          ENABLE_BILLING: 'false'
          NOTIFY_CUSTOMERS_ENABLED: 'false'
        run: pnpm crawler:preflight -- --environment=staging
      - name: Run read-only saved-extraction validator
        env:
          APP_ENV: staging
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          AI_PROVIDER: none
          AUTO_VERIFY_CLAIMABLES: 'false'
          ENABLE_BILLING: 'false'
          NOTIFY_CUSTOMERS_ENABLED: 'false'
        run: |
          set -euo pipefail
          pnpm --silent --filter @claimradar/crawler audit:candidate --candidate=04c04402-0729-42c6-b1e2-31ce7c1ba177 > audit-report.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
          if (r.type !== 'read-only-stored-candidate-audit' ||
              r.candidateId !== '04c04402-0729-42c6-b1e2-31ce7c1ba177' ||
              r.dataWritten !== false || r.aiRequestsMade !== 0 ||
              r.automaticallyApproved !== false ||
              r.requiresQualifiedLegalAndEditorialReview !== true) {
            throw Error('Read-only audit contract failed');
          }
          const safe = {
            candidateId: r.candidateId,
            historical: r.historical,
            replay: r.replay,
            eligibleForStaffReassessment: r.eligibleForStaffReassessment,
            aiRequestsMade: r.aiRequestsMade,
            dataWritten: r.dataWritten,
            requiresQualifiedLegalAndEditorialReview: r.requiresQualifiedLegalAndEditorialReview,
          };
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## One-time historical SEBI candidate audit',
            '',
            'All data was read-only; no status transition or AI call was performed.',
            '',
            '```json', JSON.stringify(safe, null, 2), '```',
          ].join('\n'));
          console.log(JSON.stringify(safe));
          NODE
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sebi-saved-extraction-readonly-audit
          path: audit-report.json
          if-no-files-found: ignore
          retention-days: 7
