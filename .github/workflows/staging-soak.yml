name: Staging Soak (48-72h)

on:
  schedule:
    - cron: '17 */6 * * *' # Every 6 hours at :17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no DB writes)'
        required: false
        default: false
        type: boolean
      auth_runtime_only:
        description: 'Run disposable authenticated runtime QA only'
        required: false
        default: false
        type: boolean
      protected_browser_qa:
        description: 'Run disposable authenticated protected browser QA only'
        required: false
        default: false
        type: boolean

concurrency:
  group: staging-soak
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  soak:
    if: inputs.auth_runtime_only != true && inputs.protected_browser_qa != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Run crawler tests
        run: pnpm --filter @claimradar/crawler test

      - name: Preflight policy gate
        run: pnpm crawler:preflight -- --environment=staging
        env:
          APP_ENV: 'staging'
          EXPECTED_STAGING_SUPABASE_PROJECT_REF: 'upvsfqufkywlpibbwrse'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          AUTO_VERIFY_CLAIMABLES: 'false'
          ENABLE_BILLING: 'false'
          NOTIFY_CUSTOMERS_ENABLED: 'false'

      - name: Run staging soak crawl
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'none' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CRAWLER_USER_AGENT: 'ClaimRadar India/1.0'
          TRAI_RELAY_URL: ${{ secrets.TRAI_RELAY_URL }}
          TRAI_RELAY_SHARED_SECRET: ${{ secrets.TRAI_RELAY_SHARED_SECRET }}
          TRAI_RELAY_TIMEOUT_MS: '15000'
          LIVE_ADAPTERS_ENABLED: 'true'
          AI_DAILY_REQUEST_BUDGET: ${{ vars.AI_DAILY_REQUEST_BUDGET || '40' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Staging safety guards — pinned, never sourced from vars/secrets.
          APP_ENV: 'staging'
          EXPECTED_STAGING_SUPABASE_PROJECT_REF: 'upvsfqufkywlpibbwrse'
          AUTO_VERIFY_CLAIMABLES: 'false'
          ENABLE_BILLING: 'false'
          NOTIFY_CUSTOMERS_ENABLED: 'false'
          CRAWLER_SUMMARY_FILE: ${{ github.workspace }}/soak-crawl-summary.json
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          pnpm crawler:daily $DRY_FLAG

      - name: Post-crawl soak acceptance gate
        shell: bash
        env:
          SUMMARY_FILE: ${{ github.workspace }}/soak-crawl-summary.json
        run: |
          if [ ! -s "$SUMMARY_FILE" ]; then
            echo "::error::Soak crawl summary file is missing or empty at $SUMMARY_FILE"
            exit 1
          fi

          node -e "
            const fs = require('node:fs');
            const summary = JSON.parse(fs.readFileSync(process.env.SUMMARY_FILE, 'utf-8'));
            console.log('Validating soak crawl summary invariants:');
            console.log(JSON.stringify(summary, null, 2));

            const errors = [];
            if (!(summary.sourcesAttempted > 0)) errors.push('sourcesAttempted must be > 0 (was ' + summary.sourcesAttempted + ')');
            if (summary.sourcesSucceeded !== summary.sourcesAttempted) errors.push('sourcesSucceeded (' + summary.sourcesSucceeded + ') must equal sourcesAttempted (' + summary.sourcesAttempted + ')');
            if (summary.sourcesFailed !== 0) errors.push('sourcesFailed must be 0 (was ' + summary.sourcesFailed + ')');
            if (!(summary.documentsDiscovered > 0)) errors.push('documentsDiscovered must be > 0 (was ' + summary.documentsDiscovered + ')');
            if (!(summary.documentsFetched > 0)) errors.push('documentsFetched must be > 0 (was ' + summary.documentsFetched + ')');
            if (summary.errorCount !== 0) errors.push('errorCount must be 0 (was ' + summary.errorCount + ')');
            if (summary.unexpectedErrorCount !== 0) errors.push('unexpectedErrorCount must be 0 (was ' + summary.unexpectedErrorCount + ')');
            if (summary.recordsPublished !== 0) errors.push('recordsPublished must be 0 in staging (was ' + summary.recordsPublished + ')');

            const g = summary.effectivePolicyGuards;
            if (!g) {
              errors.push('effectivePolicyGuards snapshot missing from summary');
            } else {
              if (g.APP_ENV !== 'staging') errors.push('effectivePolicyGuards.APP_ENV must be staging (was ' + g.APP_ENV + ')');
              if (g.AUTO_VERIFY_CLAIMABLES !== false) errors.push('effectivePolicyGuards.AUTO_VERIFY_CLAIMABLES must be false');
              if (g.ENABLE_BILLING !== false) errors.push('effectivePolicyGuards.ENABLE_BILLING must be false');
              if (g.NOTIFY_CUSTOMERS_ENABLED !== false) errors.push('effectivePolicyGuards.NOTIFY_CUSTOMERS_ENABLED must be false');
              if (g.LIVE_ADAPTERS_ENABLED !== true) errors.push('effectivePolicyGuards.LIVE_ADAPTERS_ENABLED must be true');
            }

            if (errors.length > 0) {
              console.error('❌ SOAK ACCEPTANCE GATE FAILED:');
              errors.forEach(e => console.error('  - ' + e));
              process.exit(1);
            }
            console.log('✅ SOAK ACCEPTANCE GATE PASSED: all invariants satisfied.');
          "

      - name: Publish sanitized soak job summary
        if: always()
        shell: bash
        env:
          SUMMARY_FILE: ${{ github.workspace }}/soak-crawl-summary.json
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const file = process.env.SUMMARY_FILE || 'soak-crawl-summary.json';
          if (!fs.existsSync(file)) {
            console.log('## Staging Soak Run');
            console.log('');
            console.log('_No crawl summary produced (run failed before the pipeline completed)._');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(file, 'utf-8'));
          const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
          const cleanId = (v) => String(v ?? 'unknown').replace(/[|`\\]/g, '').slice(0, 64);
          const lines = [
            '## Staging Soak (48-72h) - Run Summary',
            '',
            '| Metric | Value |',
            '| --- | --- |',
            `| Sources | ${num(s.sourcesSucceeded)}/${num(s.sourcesAttempted)} succeeded, ${num(s.sourcesFailed)} failed |`,
            `| Documents | ${num(s.documentsDiscovered)} discovered, ${num(s.documentsFetched)} fetched |`,
            `| Unchanged / duplicates | ${num(s.documentsUnchanged)} / ${num(s.documentsDuplicate)} |`,
            `| Candidates | ${num(s.candidatesCreated)} |`,
            `| AI calls | ${num(s.aiCallsUsed)} used, ${num(s.aiCallsFailed)} failed |`,
            `| Publications | ${num(s.recordsPublished)} published, ${num(s.recordsQueued)} queued, ${num(s.recordsRejected)} rejected |`,
            `| Errors | ${num(s.errorCount)} |`,
            `| Duration | ${(num(s.durationMs) / 1000).toFixed(1)}s |`,
            '',
            '### Policy Guards',
            `- \`APP_ENV\`: ${s.effectivePolicyGuards?.APP_ENV ?? 'staging'}`,
            `- \`ENABLE_BILLING\`: ${s.effectivePolicyGuards?.ENABLE_BILLING ?? false}`,
            `- \`AUTO_VERIFY_CLAIMABLES\`: ${s.effectivePolicyGuards?.AUTO_VERIFY_CLAIMABLES ?? false}`,
            `- \`NOTIFY_CUSTOMERS_ENABLED\`: ${s.effectivePolicyGuards?.NOTIFY_CUSTOMERS_ENABLED ?? false}`,
            `- \`LIVE_ADAPTERS_ENABLED\`: ${s.effectivePolicyGuards?.LIVE_ADAPTERS_ENABLED ?? false}`,
            '',
            '### Per-source status',
            '',
            '| Source | Status | Discovered | Fetched | Candidates | Errors |',
            '| --- | --- | --- | --- | --- | --- |',
          ];
          for (const p of Array.isArray(s.perSource) ? s.perSource : []) {
            lines.push(
              `| ${cleanId(p.sourceId)} | ${p.status === 'succeeded' ? 'OK' : 'FAIL'} | ${num(p.discovered)} | ${num(p.fetched)} | ${num(p.candidates)} | ${num(p.errors)} |`,
            );
          }
          console.log(lines.join('\n'));
          EOF

      - name: Upload soak run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-soak-summary
          path: ${{ github.workspace }}/soak-crawl-summary.json
          if-no-files-found: error

  auth-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.auth_runtime_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run credentialed staging auth QA
        working-directory: apps/web
        env:
          APP_ENV: staging
          EXPECTED_STAGING_SUPABASE_PROJECT_REF: upvsfqufkywlpibbwrse
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNTIME_QA_SUMMARY_FILE: ${{ github.workspace }}/staging-auth-runtime-summary.json
        run: node ../../scripts/staging-auth-runtime-qa.mjs

      - name: Publish sanitized summary
        if: always()
        shell: bash
        run: |
          if [ ! -s staging-auth-runtime-summary.json ]; then
            echo '## Staging Auth Runtime QA' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'No sanitized summary was produced.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e "const s=require('./staging-auth-runtime-summary.json'); console.log('## Staging Auth Runtime QA'); console.log(''); console.log('| Stage | Status |'); console.log('| --- | --- |'); for (const [k,v] of Object.entries(s.stages||{})) console.log('| '+k+' | '+v.status+' |'); console.log(''); console.log('Cleanup deleted users: '+s.cleanup.deletedUsers); console.log('Residual profiles: '+s.cleanup.residualProfiles);" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-auth-runtime-summary
          path: staging-auth-runtime-summary.json
          if-no-files-found: warn

  protected-browser-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.protected_browser_qa == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build exact candidate
        env:
          APP_ENV: staging
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SITE_NAME: ClaimRadar India
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_ENABLE_BILLING: 'false'
        run: pnpm build

      - name: Start exact candidate
        shell: bash
        env:
          APP_ENV: staging
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SITE_NAME: ClaimRadar India
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_ENABLE_BILLING: 'false'
        run: |
          pnpm --filter @claimradar/web exec next start -p 3000 > web-server.log 2>&1 &

      - name: Run authenticated protected browser QA
        env:
          APP_ENV: staging
          EXPECTED_STAGING_SUPABASE_PROJECT_REF: upvsfqufkywlpibbwrse
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE_URL: http://127.0.0.1:3000
          FINAL_HEAD: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PROTECTED_BROWSER_QA_SUMMARY_FILE: ${{ github.workspace }}/final-protected-browser-qa.json
        run: node scripts/final-protected-browser-qa.mjs

      - name: Upload sanitized protected browser QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-protected-browser-qa
          path: |
            final-protected-browser-qa.json
            web-server.log
          if-no-files-found: warn
