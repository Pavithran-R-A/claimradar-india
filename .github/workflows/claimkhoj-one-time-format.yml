name: One-time ClaimKhoj formatting
on:
  push:
    branches:
      - fix/claimkhoj-onboarding-auth-routing-20261009
    paths:
      - .github/workflows/claimkhoj-one-time-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            "apps/web/app/(public)/claimables/page.tsx" \
            "apps/web/tests/unit/auth-redirect.test.ts"
      - name: Commit formatting to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/web/app/(public)/claimables/page.tsx" "apps/web/tests/unit/auth-redirect.test.ts"
          if ! git diff --cached --quiet; then
            git commit -m "style: apply canonical Prettier formatting"
            git push origin HEAD:fix/claimkhoj-onboarding-auth-routing-20261009
          fi
