name: Temporary ClaimKhoj email formatting
on:
  push:
    branches:
      - release/claimkhoj-domain-notification-20261009
    paths:
      - .github/workflows/claimkhoj-email-prettier-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'
      - run: pnpm install --frozen-lockfile
      - name: Format source and brand templates
        run: |
          pnpm exec prettier --write \
            "apps/web/lib/notifications/dispatch-matches.ts" \
            "apps/web/tests/unit/claimkhoj-email-release.test.ts" \
            "supabase/email-templates/*.html"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/web/lib/notifications/dispatch-matches.ts" "apps/web/tests/unit/claimkhoj-email-release.test.ts" "supabase/email-templates/"
          if ! git diff --cached --quiet; then
            git commit -m "style: format email release code and Supabase templates"
            git push origin HEAD:release/claimkhoj-domain-notification-20261009
          fi
